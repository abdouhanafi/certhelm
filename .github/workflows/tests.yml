# Runs the automated tests on every push and pull request. They use a fake DigiCert server and
# temporary folders only - no network access to DigiCert, no real certificate store.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: python tests/run_all.py
